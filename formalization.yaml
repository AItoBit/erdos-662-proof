version: "v0.4"
project:
  name: "Erdos 662: corrected global threshold conjecture"
  description: >-
    Disproves an explicitly corrected global threshold formulation of Erdos
    problem 662. For each radius, the conjecture bounds the average number of
    nearby points in every sufficiently large one-separated planar set by the
    unit triangular lattice's neighbor count. An exact rational oblique lattice
    and separated finite replicas violate the bound at radius six.
  authors: ["Colin Snyder", "AItoBit"]
  license: "Apache-2.0"
  responsible_maintainers: ["AItoBit"]
