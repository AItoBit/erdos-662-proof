status:
  scope: >-
    Complete refutation of the chosen corrected global closed-threshold
    conjecture, including its sufficiently-large quantifier. The malformed
    original does not identify a unique intended statement. Other local,
    strict-shell and smallest-distance-multiplicity readings are outside scope.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
