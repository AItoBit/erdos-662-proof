  spend_usd: "not tracked"
  notes: >-
    The substantive source proof was already public. This work adds selective
    imports, public modules, linter repairs and an independently stated global
    conjecture with a bridge proof. Challenge's intentional proof hole is
    excluded from the proof counts.
fidelity:
  divergences: >-
    Adds the missing global normalization by the number of points and uses the
    actual cumulative triangular-lattice neighbor count. This is a disclosed
    reconstruction of inconsistent text, not a uniquely authenticated reading.
